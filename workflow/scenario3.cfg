run_dir = "run_ scenario3"
mode = "local"
ncores = 80

postprocess = true
clean = true

molecules = ["antigen.pdb","antibody_ABB.pdb" ]

[topoaa]  #topology generation

[rigidbody]
ambig_fname = "ti_exp.tbl” # Experimental restraints
unambig_fname = "unambig.tbl" # Restraints to keep the antibody chains together
sampling = 10000

[caprieval]
reference_fname = "4G6M_ref.pdb"

[clustfcc]
min_population = 1

[seletopclusts]
top_models = 1 

[flexref]
tolerance = 5
ambig_fname = "ti_exp.tbl” # Experimental restraints
unambig_fname = "unambig.tbl"

[caprieval]
reference_fname = "4G6M_ref.pdb"

[emref]
tolerance = 5
ambig_fname = "ti_exp.tbl” # Experimental restraints
unambig_fname = "unambig.tbl"

