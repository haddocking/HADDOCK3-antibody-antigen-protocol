run_dir = "run_ scenario1"
mode = "local"
ncores = 80

molecules = ["antigen.pdb",
                     "antibody_ABB.pdb" ]

# topology generation
[topoaa]  

# rigidbody docking (default settings with 1000 models)
[rigidbody]
ambig_fname = "ti_AF3.tbl" # AF3 restraints
unambig_fname = "unambig.tbl" # Restraints to keep the antibody chains together


# analysis
[caprieval]
reference_fname = "4G6M_ref.pdb"

# select the top 200 (default) models
[seletop]

# semi-flexible refinement of the interface
[flexref]
ambig_fname = "ti_AF3.tbl" # AF3 restraints
unambig_fname = "unambig.tbl"

# analysis
[caprieval]
reference_fname = "4G6M_ref.pdb"

# energy minimisation
[emref]
ambig_fname = "ti_AF3.tbl" # AF3 restraints
unambig_fname = "unambig.tbl"

# analysis
[caprieval]
reference_fname = "4G6M_ref.pdb"

# fraction of contact clustering
[clustfcc]
min_population = 1  #keep all unclustered models

# selection of top clusters
[seletopclusts]
top_clusters = 10

# analysis
[caprieval]
reference_fname = "4G6M_ref.pdb"

