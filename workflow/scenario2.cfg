run_dir = "run_ scenario2"
mode = "local"
ncores = 80

postprocess = true
clean = true

molecules = ["antigen.pdb","antibody_ABB.pdb" ]

[topoaa]  #topology generation
[rigidbody]
ambig_fname = "ti_AGpassive.tbl" # CDR + surface restraints
unambig_fname = "unambig.tbl" # Restraints to keep the antibody chains together
sampling = 1000
[caprieval]
reference_fname = "4G6M_ref.pdb"
[seletop]
[flexref]
tolerance = 5
ambig_fname = "ti.tbl"
unambig_fname = "unambig.tbl"
[caprieval]
reference_fname = "4G6M_ref.pdb"
[emref]
tolerance = 5
ambig_fname = "ti.tbl"
unambig_fname = "unambig.tbl"
[caprieval]
reference_fname = "4G6M_ref.pdb"
[clustfcc]
min_population = 1
[seletopclust]
top_clusters = 10
[caprieval]
reference_fname = "4G6M_ref.pdb"



