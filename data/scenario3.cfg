run_dir = "run_scenario3"
mode = "local"
ncores = 80

molecules = ["antigen.pdb","antibody_ABB.pdb"]

# topology generation
[topoaa] 

# rigidbody docking (default settings with 1000 models)
[rigidbody]
ambig_fname = "CDR-NMRepitope.tbl" # Experimental restraints
unambig_fname = "unambig.tbl" # Restraints to keep the antibody chains together
sampling = 10000

# analysis
[caprieval]
reference_fname = "4G6M_ref.pdb"

# select the top 200 models
[seletop]


# semi-flexible refinement of the interface
[flexref]
ambig_fname = "CDR-NMRepitope.tbl" # Experimental restraints
unambig_fname = "unambig.tbl" # Restraints to keep the antibody chains together

# analysis
[caprieval]
reference_fname = "4G6M_ref.pdb"

# energy minimisation
[emref]
ambig_fname = "CDR-NMRepitope.tbl" # Experimental restraints
unambig_fname = "unambig.tbl" # Restraints to keep the antibody chains together

# analysis
[caprieval]
reference_fname = "4G6M_ref.pdb"

# fraction of contact clustering
[clustfcc]
min_population = 1 #To keep all unclustered models 

# selection of top clusters
[seletopclusts]

# analysis
[caprieval]
reference_fname = "4G6M_ref.pdb"

